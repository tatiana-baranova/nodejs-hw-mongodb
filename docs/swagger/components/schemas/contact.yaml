type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 680e21ddc1ef3c47b8a1f6ca
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: number
    example: +380(97)354-45-44
  email:
    description: "Contact's email"
    type: string
    example: 'john@gmail.com'
  contactType:
    description: "Contact's type"
    type: string
    example: ['work', 'home', 'personal']
    default: 'personal'
  userId:
    description: "Contact's user id"
    type: string
    example: 680e21ddc1ef3c47b8a1f6ca
  isFavourite:
    description: "Contact's favourite"
    type: boolean
    example: true
    default: false
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
