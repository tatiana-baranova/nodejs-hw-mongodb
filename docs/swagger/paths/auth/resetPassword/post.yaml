tags:
  - Auth
summary: Reset Password
operationId: resetPassword
description: Reset password in the Application
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            type: string
            description: 'Token in browser string'
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2N2ZmOTU1MzRmN2E4YjIzNGJkYzBmOWEiLCJlbWFpbCI6Imt5cm9zaWthNTY1QGdtYWlsLmNvbSIsImlhdCI6MTc0NDgyMDA3NywiZXhwIjoxNzQ0ODIwMzc3fQ.dl9xuVkz5wIVDa-U5fl8lrL0BSPKNISclmTMZfuUDVw'
          password:
            type: string
            description: 'User password'
            example: '258gvhg854d'
responses:
  '200':
    description: Reset password email was successfully sent!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password was successfully reset!
            data:
              type: object
              example: {}
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: ../../../components/responses/404.yaml
