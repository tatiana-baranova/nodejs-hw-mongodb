tags:
  - Auth
summary: Login User
operationId: loginUser
description: 'Login user in the Application'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: 'User Email'
            type: string
            example: 'john@gmail.com'
          password:
            description: 'User Password'
            type: string
            example: 'cdsbn515vgbbf'
responses:
  '200':
    description: Successfully logged in an user!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in an user!'
            data:
              type: object
              example:
                accessToken: F0bHemvooANGkk37QXkAmIsHKwdUFEdC1FZe10+g
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
